version: 2
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # Same idea as minimumReleaseAge: wait a few days before proposing a new
    # version, so compromised releases are pulled before they reach us.
    cooldown:
      default-days: 3
    commit-message:
      prefix: ":arrow_up: chore(deps):"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ":arrow_up: ci(actions):"
